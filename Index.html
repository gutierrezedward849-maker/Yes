
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visitor Information</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 25px 16px;
    background: #090a0c;
    color: #e5e5e5;
    font-family: Arial, sans-serif;
}

main {
    max-width: 650px;
    margin: auto;
}

h1 {
    font-size: 25px;
    font-weight: 500;
}

.subtitle, .muted {
    color: #858585;
    font-size: 13px;
}

.panel {
    background: #111317;
    border: 1px solid #292d34;
    border-radius: 7px;
    margin: 15px 0;
    padding: 17px;
}

h2 {
    font-size: 11px;
    color: #9baec4;
    letter-spacing: 2px;
}

.item {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 11px 0;
    border-bottom: 1px solid #25282e;
    font-size: 12px;
}

.item:last-child { border: none; }

.key { color: #888; }

.value {
    text-align: right;
    overflow-wrap: anywhere;
}

#countdown {
    color: #a8c8ed;
    font-size: 13px;
    margin-top: 25px;
}

</style>
</head>

<body>
<main>

<h1>Visitor Information</h1>
<p class="subtitle">Device and network information</p>

<div class="panel">
<h2>NETWORK INFORMATION</h2>
<div id="network">Loading...</div>
</div>

<div class="panel">
<h2>GEOGRAPHIC INFORMATION</h2>
<div id="location">Loading...</div>
</div>

<div class="panel">
<h2>PROVIDER INFORMATION</h2>
<div id="provider">Loading...</div>
</div>

<div class="panel">
<h2>DEVICE INFORMATION</h2>
<div id="device"></div>
</div>

<div class="panel">
<h2>GPS INFORMATION</h2>
<div id="gps">Not requested.</div>
<p class="muted">Precise GPS requires browser permission.</p>
</div>

<p id="countdown">Preparing redirect...</p>

</main>

<script>

// CHANGE DESTINATION HERE
const DESTINATION = "https://urlto.me/2raxf";

const REDIRECT_DELAY = 3000;

function row(container, label, value) {
    const item = document.createElement("div");
    item.className = "item";

    const key = document.createElement("span");
    key.className = "key";
    key.textContent = label;

    const val = document.createElement("span");
    val.className = "value";
    val.textContent = value ?? "Unavailable";

    item.append(key, val);
    container.appendChild(item);
}

function fill(id, data) {
    const target = document.getElementById(id);
    target.replaceChildren();

    for (const [label, value] of Object.entries(data)) {
        row(target, label, String(value ?? "Unavailable"));
    }
}

// DEVICE INFORMATION
const ua = navigator.userAgent;

fill("device", {
    Browser: /Edg\//.test(ua) ? "Edge" :
             /Firefox/.test(ua) ? "Firefox" :
             /Chrome/.test(ua) ? "Chrome" :
             /Safari/.test(ua) ? "Safari" : "Unknown",

    Platform: navigator.platform,
    UserAgent: ua,
    Language: navigator.language,
    Timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    Resolution: `${screen.width} x ${screen.height}`,
    PixelRatio: devicePixelRatio,
    CPUThreads: navigator.hardwareConcurrency || "Unavailable",
    Memory: navigator.deviceMemory
        ? navigator.deviceMemory + " GB"
        : "Unavailable",
    TouchPoints: navigator.maxTouchPoints
});

// IP INFORMATION
async function loadIP() {
    try {
        const response = await fetch("https://ipwho.is/");
        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error("Lookup unavailable");
        }

        fill("network", {
            PublicIP: data.ip,
            Version: data.type
        });

        fill("location", {
            Country: data.country,
            CountryCode: data.country_code,
            Region: data.region,
            City: data.city,
            PostalCode: data.postal,
            Latitude: data.latitude,
            Longitude: data.longitude
        });

        const connection = data.connection || {};

        fill("provider", {
            ISP: connection.isp,
            Organization: connection.org,
            ASN: connection.asn,
            Domain: connection.domain,
            VPNDetection: "Not assessed"
        });

    } catch {
        ["network", "location", "provider"].forEach(id => {
            document.getElementById(id).textContent =
                "Information unavailable.";
        });
    }
}

// GPS: REQUEST EXPLICIT PERMISSION
function requestGPS() {
    if (!navigator.geolocation) {
        document.getElementById("gps").textContent =
            "GPS unavailable.";
        return;
    }

    navigator.geolocation.getCurrentPosition(
        position => {
            const c = position.coords;

            fill("gps", {
                Latitude: c.latitude,
                Longitude: c.longitude,
                Accuracy: `${Math.round(c.accuracy)} meters`
            });
        },
        () => {
            document.getElementById("gps").textContent =
                "Permission denied or location unavailable.";
        },
        {
            enableHighAccuracy: true,
            timeout: 20000,
            maximumAge: 0
        }
    );
}

// AUTOMATIC EXECUTION
async function initialize() {
    requestGPS();

    await loadIP();

    document.getElementById("countdown").textContent =
        "kkkkkkk";

    setTimeout(() => {
        window.location.replace(DESTINATION);
    }, REDIRECT_DELAY);
}

initialize();

</script>
</body>
</html>
